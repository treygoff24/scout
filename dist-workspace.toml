[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# release.yml carries intentional hand edits (pinned action majors, pipefail, comments); dist would otherwise refuse to plan
allow-dirty = ["ci"]
installers = ["shell", "homebrew"]
tap = "treygoff24/homebrew-tap"
# Formula name so `brew install treygoff24/tap/scout` works despite the scout-cli package name
formula = "scout"
publish-jobs = ["homebrew"]
# Windows is a documented v1 non-goal, so no windows target
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[profile.dist]
inherits = "release"
lto = "thin"
